# Gateway for the standalone (single-tenant, self-hosted) deployment.
#
# Same one-origin rule as the cloud gateway — the React console and the
# cookie-authenticated API must share an origin — minus everything that only
# exists to face the public internet: no site container (the open deployment
# carries no marketing website), no /admin platform console, and no
# registration rate-limit zone, because the standalone edition mounts no
# registration surface at all. The root redirects straight into the console.

resolver 127.0.0.11 ipv6=off valid=10s;

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    application/javascript
    text/javascript
    application/json
    application/manifest+json
    image/svg+xml
    application/xml;

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    absolute_redirect off;
    client_max_body_size 16m;

    # Variable proxy targets make Docker DNS re-resolve services after a
    # rolling container replacement.
    set $api_upstream http://api:8000;
    set $console_upstream http://console:8080;

    location = /_health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 308 /console/;
    }

    location = /console {
        return 308 /console/;
    }

    location /console/ {
        proxy_pass $console_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI owns the API, the public account/device pages under /web, and
    # its own technical reference. No /admin here: the standalone assembly
    # serves no platform console, and the gateway should say 404 rather than
    # forward dead paths.
    location ~ ^/(?:api/v1|web|redoc|healthz|livez|readyz|oauth|mcp|\.well-known/oauth-authorization-server|\.well-known/oauth-protected-resource)(?:/|$) {
        error_page 502 503 504 = @api_unavailable;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The API and MCP answer JSON; so must the gateway when they cannot
    # answer. An HTML 502 page read as JSON told agents the tool was broken,
    # not that the server was away for a moment.
    location @api_unavailable {
        default_type application/json;
        add_header Retry-After 5 always;
        add_header Cache-Control "no-store" always;
        return 503 '{"detail":"oryh API is temporarily unavailable: the upstream did not answer or timed out; retry shortly"}';
    }

    location = /openapi.json {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is 404, not a fallback page: a wrong API path answered
    # with 200 and HTML is indistinguishable from success to an agent.
    location / {
        return 404;
    }
}
