# Console container. Serves only the authenticated React application under
# /console with base "/console/". The public website lives in its own
# container (Dockerfile.site / nginx.site.conf); this container deliberately
# 404s anything outside /console so the compose gateway owns all routing.

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    application/javascript
    text/javascript
    application/json
    application/manifest+json
    image/svg+xml
    application/xml;

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    client_max_body_size 16m;

    location = /_health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /console {
        return 308 /console/;
    }

    location = /console/index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # Vite emits content-hashed build artifacts under this directory.
    location ^~ /console/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /console/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri $uri/ /console/index.html;
    }

    location / {
        return 404;
    }
}
