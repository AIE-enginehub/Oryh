name: Publish Container Images

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/aie-enginehub/oryh-api
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - id: meta-console
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/aie-enginehub/oryh-console
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push oryh-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

      - name: Build and push oryh-console
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-console.outputs.tags }}
          labels: ${{ steps.meta-console.outputs.labels }}
          build-args: |
            ORYH_APP_VERSION=${{ github.ref_name }}
