[project]
name = "oryh-timesheet"
version = "0.1.0"
description = "Lightweight timesheet recording service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.28.1,<1.0.0",  # the MCP door dispatches tool calls in process through the ASGI app
  "alembic>=1.15.0,<2.0.0",
  "fastapi>=0.116.0,<1.0.0",
  "jinja2>=3.1.0,<4.0.0",
  "jsonschema>=4.21.0,<5.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "psycopg[binary]>=3.2.9,<4.0.0",
  "python-multipart>=0.0.9,<1.0.0",
  "sqlalchemy>=2.0.41,<3.0.0",
  "tldextract>=5.1.2,<6.0.0",
  "uvicorn>=0.35.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<1.0.0",
  "pytest>=8.4.1,<9.0.0",
]

[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["web/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Only `app*` is installed, so `scripts/` is importable from a test run but not
# from an installed package. test_frontend_contract.py exports the console
# contract through the same code the developer runs, rather than restating it.
pythonpath = ["."]
