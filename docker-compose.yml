# Standalone (single-tenant, self-hosted) deployment: the whole product for
# one company, no SaaS platform layer, no marketing site.
#
#   docker compose -f docker-compose.standalone.yml up -d
#   docker compose -f docker-compose.standalone.yml logs api   # first-boot credentials
#
# First boot creates the workspace and prints its credentials ONCE to the api
# service log: the console sign-in (ORYH_STANDALONE_ADMIN_EMAIL, password
# generated unless ORYH_STANDALONE_ADMIN_PASSWORD is set) and a service API
# key for connecting agents. Open http://127.0.0.1:8080/ afterwards.
#
# Deliberately separate from docker-compose.yml (the cloud-posture stack) and
# on its own volume: the two files model different products of the same code,
# and sharing a database between postures is how a test cloud eats a real
# workspace.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oryh
      POSTGRES_USER: ofbiz
      POSTGRES_PASSWORD: ofbiz
    volumes:
      - oryh-standalone-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ofbiz -d oryh"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: "${ORYH_API_IMAGE:-oryh-api}:${ORYH_API_TAG:-latest}"
    build: .
    environment:
      # Force the assembly even though this image carries app/saas: a cloud
      # image run from THIS file must still be a standalone instance.
      ORYH_EDITION: standalone
      # Runtime connects as the restricted oryh_app role so row-level
      # security applies; migrations and ops scripts use the owning role.
      ORYH_DATABASE_URL: postgresql+psycopg://oryh_app:${ORYH_APP_DB_PASSWORD:-oryh-app-dev}@db:5432/oryh
      ORYH_MIGRATION_DATABASE_URL: postgresql+psycopg://ofbiz:ofbiz@db:5432/oryh
      ORYH_APP_DB_PASSWORD: ${ORYH_APP_DB_PASSWORD:-oryh-app-dev}
      ORYH_DATABASE_SCHEMA: oryh
      # Leave unset on a box reached by plain http; links and origin checks
      # then follow the address each request came in on.
      ORYH_BASE_URL: ${ORYH_BASE_URL:-}
      # "console" prints outbound mail (invitations, password resets) to this
      # service's log — a standalone box has no SMTP until its operator adds
      # one, and invitations must still be usable from `docker compose logs`.
      ORYH_EMAIL_BACKEND: ${ORYH_EMAIL_BACKEND:-console}
      ORYH_SMTP_HOST: ${ORYH_SMTP_HOST:-}
      ORYH_SMTP_PORT: ${ORYH_SMTP_PORT:-465}
      ORYH_SMTP_USER: ${ORYH_SMTP_USER:-}
      ORYH_SMTP_PASSWORD: ${ORYH_SMTP_PASSWORD:-}
      ORYH_SMTP_FROM: ${ORYH_SMTP_FROM:-}
      # First-boot workspace facts; inert once any tenant exists.
      ORYH_STANDALONE_COMPANY_NAME: ${ORYH_STANDALONE_COMPANY_NAME:-我的公司}
      ORYH_STANDALONE_ADMIN_EMAIL: ${ORYH_STANDALONE_ADMIN_EMAIL:-admin@oryh.local}
      ORYH_STANDALONE_ADMIN_PASSWORD: ${ORYH_STANDALONE_ADMIN_PASSWORD:-}
      ORYH_SKIP_STARTUP_MAINTENANCE: ${ORYH_SKIP_STARTUP_MAINTENANCE:-false}
      ORYH_SKILL_BRAND: ${ORYH_SKILL_BRAND:-oryh}
    command:
      - sh
      - -c
      - |
        if [ "$${ORYH_SKIP_STARTUP_MAINTENANCE:-false}" != "true" ]; then
          alembic upgrade head
          python scripts/bootstrap_db_roles.py
          python scripts/sync_tenant_defaults.py
          python scripts/ensure_standalone_tenant.py
        else
          echo "startup maintenance skipped for image-only rollback"
        fi
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  console:
    image: "${ORYH_CONSOLE_IMAGE:-oryh-console}:${ORYH_CONSOLE_TAG:-latest}"
    build:
      context: ./frontend
      args:
        ORYH_APP_VERSION: ${ORYH_APP_VERSION:-}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/console/",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  gateway:
    image: nginxinc/nginx-unprivileged:1.28.1-alpine
    depends_on:
      api:
        condition: service_healthy
      console:
        condition: service_healthy
    ports:
      - "${ORYH_CONSOLE_PORT:-8080}:8080"
    volumes:
      - ./nginx/nginx.standalone.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/_health",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  # Self-hosted flow driving, opt-in and bring-your-own everything: your own
  # credentials file (the workspace's service key), your own agent runtime and
  # model key. No bootstrap token — that mechanism exists for a fleet serving
  # many tenants, and here the credentials file IS the whole tenant set.
  #
  #   docker compose -f docker-compose.standalone.yml --profile flow-runner up -d
  #
  # Without flow skills installed no default subscriptions exist, so the
  # runner idles until the workspace authors a flow skill and enables a
  # subscription. Leave ORYH_RUNNER_PI_BINARY unset to watch it against the
  # stub adapter before spending model calls.
  flow-runner:
    image: "${ORYH_RUNNER_IMAGE:-oryh-flow-runner}:${ORYH_RUNNER_TAG:-latest}"
    build:
      context: .
      dockerfile: docker/flow-runner.Dockerfile
    profiles: ["flow-runner"]
    environment:
      ORYH_RUNNER_BASE_URL: ${ORYH_RUNNER_BASE_URL:-http://api:8000/api/v1}
      # [{"tenant_id": "...", "api_key": "..."}] — the workspace id and a
      # service key (the bootstrap key from first boot works).
      ORYH_RUNNER_CREDENTIALS_FILE: /run/secrets/flow-runner-credentials.json
      ORYH_RUNNER_STATE_FILE: /var/lib/oryh-flow-runner/acquired.json
      ORYH_RUNNER_POLL_INTERVAL_SECONDS: ${ORYH_RUNNER_POLL_INTERVAL_SECONDS:-30}
      ORYH_RUNNER_IDLE_REPORT_SECONDS: ${ORYH_RUNNER_IDLE_REPORT_SECONDS:-3600}
      ORYH_RUNNER_MAX_UNMOVED_RUNS: ${ORYH_RUNNER_MAX_UNMOVED_RUNS:-3}
      ORYH_RUNNER_MAX_RECORDS_PER_RUN: ${ORYH_RUNNER_MAX_RECORDS_PER_RUN:-10}
      ORYH_RUNNER_BUNDLE_TTL_SECONDS: ${ORYH_RUNNER_BUNDLE_TTL_SECONDS:-3600}
      # Set to "pi" to actually spend model calls; unset means stub adapter.
      ORYH_RUNNER_PI_BINARY: ${ORYH_RUNNER_PI_BINARY:-}
      ORYH_RUNNER_PI_PROVIDER: ${ORYH_RUNNER_PI_PROVIDER:-}
      ORYH_RUNNER_PI_MODEL: ${ORYH_RUNNER_PI_MODEL:-}
      ORYH_RUNNER_PI_TIMEOUT_SECONDS: ${ORYH_RUNNER_PI_TIMEOUT_SECONDS:-420}
      # {"YOUR_PROVIDER_API_KEY": "..."} — your own model credential, read
      # fresh per run and passed only to the agent child process.
      ORYH_RUNNER_PROVIDER_ENV_FILE: /run/secrets/flow-runner-provider.json
    volumes:
      - ${ORYH_RUNNER_CREDENTIALS_HOST_FILE:-./flow-runner-credentials.json}:/run/secrets/flow-runner-credentials.json:ro
      - ${ORYH_RUNNER_PROVIDER_HOST_FILE:-./flow-runner-provider.json}:/run/secrets/flow-runner-provider.json:ro
      - oryh-standalone-flow-runner-state:/var/lib/oryh-flow-runner
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  oryh-standalone-postgres-data:
  oryh-standalone-flow-runner-state:
