{% extends "base.html" %}
{% block title %}Platform sign in{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>Platform admin</h1>
  <p class="muted">Operator sign-in for the Oryh service. Company users sign in on the <a href="/console/login">console sign-in page</a>.</p>
  <form method="post" action="/admin/login">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required maxlength="320" value="{{ email or '' }}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required maxlength="200">
    <button type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
