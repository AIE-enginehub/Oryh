{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>登录</h1>
  <form method="post" action="/web/login">
    <input type="hidden" name="next" value="{{ next or '' }}">
    <label for="email">邮箱</label>
    <input id="email" name="email" type="email" required maxlength="320" value="{{ email or '' }}">
    <label for="password">密码</label>
    <input id="password" name="password" type="password" required maxlength="200">
    <p class="muted"><a href="/console/login?mode=reset">忘记密码？</a></p>
    <button type="submit">登录</button>
  </form>
  <p class="muted">新公司？<a href="/web/register">注册</a></p>
  <p class="muted">要接入 AI agent（WorkBuddy 等）？<a href="/web/connect">获取 oryh-connect 技能</a></p>
</div>
{% endblock %}
